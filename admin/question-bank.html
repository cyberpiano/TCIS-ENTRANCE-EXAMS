<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Bank - TCIS Entrance Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <style>
        /* ImgBB Upload Widget */
        .img-upload-zone {
            border: 2px dashed #c7d2fe; border-radius: 0.75rem;
            padding: 1rem; text-align: center; cursor: pointer;
            transition: all .2s; background: #f8faff;
        }
        .img-upload-zone:hover { border-color: #6366f1; background: #eef2ff; }
        .img-upload-zone.has-preview { border-style: solid; border-color: #a5b4fc; }
        #qm-img-preview { max-height: 120px; max-width: 100%; border-radius: 0.5rem; object-fit: contain; display: none; margin: 0.5rem auto 0; }
        .upload-progress { height: 3px; border-radius: 2px; background: #e2e8f0; overflow: hidden; margin-top: 0.5rem; }
        .upload-progress-bar { height: 100%; background: #6366f1; transition: width .3s; width: 0%; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex">

    <div id="admin-sidebar-container"></div>

    <div class="flex-1 ml-64 p-8 overflow-y-auto">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-8 pb-4 border-b border-slate-200">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900 font-heading">Question Bank Repository</h1>
                <p class="text-slate-500 text-xs mt-1">Create, edit, duplicate, and organize examination questions across all 8 question types.</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="window.TCISQuestions.downloadQuestionBankCSVTemplate()" class="px-4 py-2.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-100 text-slate-600 font-semibold text-xs transition-all flex items-center gap-2">
                    <i class="fa-solid fa-file-arrow-down text-indigo-400"></i> Sample CSV
                </button>
                <button onclick="openQBankImportModal()" class="px-4 py-2.5 rounded-xl border border-indigo-500/40 bg-indigo-600/20 hover:bg-indigo-600 text-indigo-300 hover:text-white font-semibold text-xs transition-all flex items-center gap-2">
                    <i class="fa-solid fa-file-csv"></i> Import Questions CSV
                </button>
                <button onclick="openQuestionModal()" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-lg shadow-indigo-600/30 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Create Question
                </button>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="glass-panel p-4 rounded-2xl border border-slate-200 mb-6 flex flex-col sm:flex-row items-center gap-4">
            <div class="relative flex-1 w-full">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500"><i class="fa-solid fa-magnifying-glass"></i></span>
                <input type="text" id="q-search" onkeyup="filterQuestionsTable()" placeholder="Search question text or topic..." class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-900 text-xs focus:outline-none focus:border-indigo-500">
            </div>
            <select id="q-filter-subject" onchange="filterQuestionsTable()" class="bg-white text-black text-xs p-2.5 rounded-xl border border-slate-200 w-full sm:w-48">
                <option value="" class="text-black bg-white">All Subjects</option>
            </select>
            <select id="q-filter-type" onchange="filterQuestionsTable()" class="bg-white text-black text-xs p-2.5 rounded-xl border border-slate-200 w-full sm:w-40">
                <option value="" class="text-black bg-white">All Types</option>
                <option value="mcq" class="text-black bg-white">Multiple Choice</option>
                <option value="true_false" class="text-black bg-white">True / False</option>
                <option value="short_answer" class="text-black bg-white">Short Answer</option>
                <option value="fill_blank" class="text-black bg-white">Fill in Blank</option>
                <option value="essay" class="text-black bg-white">Essay</option>
                <option value="matching" class="text-black bg-white">Matching</option>
                <option value="multi_select" class="text-black bg-white">Multiple Select</option>
            </select>
        </div>

        <!-- Question Bank Data Table -->
        <div class="glass-panel rounded-3xl border border-slate-200 overflow-hidden shadow-2xl">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-50/80 border-b border-slate-200 text-[11px] font-bold uppercase text-slate-500">
                        <th class="p-4 pl-6">Question Text</th>
                        <th class="p-4">Subject / Topic</th>
                        <th class="p-4">Type</th>
                        <th class="p-4">Correct Answer</th>
                        <th class="p-4">Marks</th>
                        <th class="p-4 pr-6 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody id="qbank-table-body" class="divide-y divide-slate-200/60 text-xs text-slate-600">
                    <!-- Rendered by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Question Editor Modal -->
    <div id="q-modal" class="hidden fixed inset-0 z-50 bg-slate-50/80 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl border border-slate-200 max-w-2xl w-full p-6 shadow-2xl space-y-4 my-8 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b border-slate-200 pb-3">
                <h3 id="q-modal-title" class="text-lg font-bold text-slate-900 font-heading">Create Question</h3>
                <button onclick="closeQuestionModal()" class="text-slate-500 hover:text-slate-900"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <form id="question-form" class="space-y-4">
                <input type="hidden" id="edit-q-id">

                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Subject *</label>
                        <select id="qm-subject" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-black text-xs">
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Question Type *</label>
                        <select id="qm-type" onchange="renderQuestionTypeFields()" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-black text-xs">
                            <option value="mcq" class="text-black bg-white">1. Multiple Choice (MCQ)</option>
                            <option value="true_false" class="text-black bg-white">2. True / False</option>
                            <option value="short_answer" class="text-black bg-white">3. Short Answer</option>
                            <option value="fill_blank" class="text-black bg-white">4. Fill in the Blank</option>
                            <option value="essay" class="text-black bg-white">5. Essay / Long Answer</option>
                            <option value="matching" class="text-black bg-white">6. Matching</option>
                            <option value="multi_select" class="text-black bg-white">7. Multiple Select</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">Marks *</label>
                        <input type="number" id="qm-marks" value="2" min="1" step="0.5" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-xs">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Question Text *</label>
                    <textarea id="qm-text" rows="3" required placeholder="Enter question..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-xs"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Question Image (Optional)</label>
                    <!-- ImgBB Upload Widget -->
                    <div class="space-y-2">
                        <div id="qm-upload-zone" class="img-upload-zone" onclick="document.getElementById('qm-img-file').click()">
                            <i class="fa-solid fa-cloud-arrow-up text-indigo-400 text-xl mb-1"></i>
                            <p class="text-xs text-slate-500">Click to upload image <span class="text-indigo-500 font-semibold">(ImgBB)</span></p>
                            <p class="text-[10px] text-slate-400">JPG, PNG, GIF — max 32MB</p>
                            <img id="qm-img-preview" src="" alt="Preview">
                            <div class="upload-progress mt-2" id="qm-upload-progress-wrap" style="display:none">
                                <div class="upload-progress-bar" id="qm-upload-progress-bar"></div>
                            </div>
                            <span id="qm-upload-status" class="text-[10px] text-indigo-500 font-semibold block mt-1"></span>
                        </div>
                        <input type="file" id="qm-img-file" accept="image/*" class="hidden" onchange="handleImageFileSelect(this)">
                        <div class="flex items-center gap-2">
                            <div class="flex-1 h-px bg-slate-200"></div>
                            <span class="text-[10px] text-slate-400 font-semibold">OR paste URL directly</span>
                            <div class="flex-1 h-px bg-slate-200"></div>
                        </div>
                        <input type="text" id="qm-image" placeholder="https://i.ibb.co/... or uploaded image" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-xs" oninput="previewUrlImage(this.value)">
                    </div>
                </div>

                <!-- Dynamic Options / Answers Container based on Question Type -->
                <div id="qm-dynamic-type-container" class="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-3">
                    <!-- Configured by JS -->
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Explanation / Solution Feedback</label>
                    <input type="text" id="qm-explanation" placeholder="Shown to student during answer review..." class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-xs">
                </div>

                <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-200">
                    <button type="button" onclick="closeQuestionModal()" class="px-4 py-2 rounded-xl border border-slate-700 text-slate-600 text-xs">Cancel</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs">Save Question</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/utils.js"></script>
    <!-- Firebase Web SDK v10 (Compat Mode) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>
    <script src="../js/firebase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/questions.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        function getImgBBApiKey() {
            const rawSettings = window.TCISDB.getCollection('settings');
            const settings = Array.isArray(rawSettings) ? (rawSettings[0] || {}) : (rawSettings || {});
            return settings.imgbbApiKey || '5104290486754c55f073a408415e8ddb';
        }

        // Compress image using canvas so it fits cleanly in Firestore/localStorage
        function compressImage(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = () => resolve(e.target.result);
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Image Upload Functions
        async function handleImageFileSelect(input) {
            const file = input.files[0];
            if (!file) return;

            // Show local preview immediately
            const reader = new FileReader();
            reader.onload = (e) => {
                const preview = document.getElementById('qm-img-preview');
                preview.src = e.target.result;
                preview.style.display = 'block';
                document.getElementById('qm-upload-zone').classList.add('has-preview');
            };
            reader.readAsDataURL(file);

            const apiKey = getImgBBApiKey();

            document.getElementById('qm-upload-status').textContent = 'Uploading to cloud...';
            document.getElementById('qm-upload-progress-wrap').style.display = 'block';
            document.getElementById('qm-upload-progress-bar').style.width = '30%';

            try {
                // Compress image first to keep payload fast and light
                const compressedBase64 = await compressImage(file, 900, 0.75);
                document.getElementById('qm-upload-progress-bar').style.width = '60%';

                const rawBase64 = compressedBase64.split(',')[1];
                const formData = new FormData();
                formData.append('image', rawBase64);

                const res = await fetch(`https://api.imgbb.com/1/upload?key=${apiKey}`, {
                    method: 'POST', body: formData
                });
                const data = await res.json();
                document.getElementById('qm-upload-progress-bar').style.width = '100%';

                if (data.success && data.data && data.data.url) {
                    document.getElementById('qm-image').value = data.data.url;
                    document.getElementById('qm-upload-status').textContent = '✓ Uploaded to ImgBB!';
                    document.getElementById('qm-upload-status').style.color = '#10b981';
                } else {
                    // Fallback to compressed base64 (already optimized to <100KB)
                    document.getElementById('qm-image').value = compressedBase64;
                    document.getElementById('qm-upload-status').textContent = '✓ Saved locally (compressed)';
                    document.getElementById('qm-upload-status').style.color = '#10b981';
                }
            } catch (err) {
                console.warn('ImgBB upload fallback:', err);
                // Fallback to compressed base64
                try {
                    const compressedBase64 = await compressImage(file, 800, 0.65);
                    document.getElementById('qm-image').value = compressedBase64;
                    document.getElementById('qm-upload-status').textContent = '✓ Saved locally (compressed)';
                    document.getElementById('qm-upload-status').style.color = '#10b981';
                } catch (e2) {
                    document.getElementById('qm-upload-status').textContent = '✗ Upload error. Paste URL manually.';
                    document.getElementById('qm-upload-status').style.color = '#ef4444';
                }
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function previewUrlImage(url) {
            if (!url) {
                document.getElementById('qm-img-preview').style.display = 'none';
                document.getElementById('qm-upload-zone').classList.remove('has-preview');
                return;
            }
            const preview = document.getElementById('qm-img-preview');
            preview.src = url;
            preview.style.display = 'block';
            document.getElementById('qm-upload-zone').classList.add('has-preview');
        }

        function resetImageUploadUI() {
            const preview = document.getElementById('qm-img-preview');
            preview.src = '';
            preview.style.display = 'none';
            document.getElementById('qm-upload-zone').classList.remove('has-preview');
            document.getElementById('qm-upload-status').textContent = '';
            document.getElementById('qm-upload-progress-wrap').style.display = 'none';
            document.getElementById('qm-upload-progress-bar').style.width = '0%';
            document.getElementById('qm-img-file').value = '';
        }


        document.addEventListener('DOMContentLoaded', () => {
            if (!window.TCISAuth.requireAdminAuth()) return;
            window.TCISAdmin.renderAdminNavigation('question-bank');
            (window.TCISDB.syncReady || Promise.resolve()).then(() => {
                populateSubjects();
                renderQBankTable();
                renderQuestionTypeFields();
            }).catch(() => {
                populateSubjects();
                renderQBankTable();
                renderQuestionTypeFields();
            });
        });

        function populateSubjects() {
            const subjects = window.TCISDB.getCollection('subjects') || [];
            const filterSelect = document.getElementById('q-filter-subject');
            const modalSelect = document.getElementById('qm-subject');
            
            let filterHtml = '<option value="" class="text-black bg-white">All Subjects</option>';
            let modalHtml = '';

            subjects.forEach(sub => {
                const title = window.TCISUtils.escapeHTML(sub.title || sub.name || 'Unnamed Subject');
                filterHtml += `<option value="${title}" class="text-black bg-white">${title}</option>`;
                modalHtml += `<option value="${title}" class="text-black bg-white">${title}</option>`;
            });

            if (subjects.length === 0) {
                modalHtml = '<option value="" class="text-black bg-white">No subjects found - please add subjects first</option>';
            }

            if (filterSelect) filterSelect.innerHTML = filterHtml;
            if (modalSelect) modalSelect.innerHTML = modalHtml;
        }

        function renderQBankTable(list) {
            const qList = list || window.TCISQuestions.getAllQuestions();
            const tbody = document.getElementById('qbank-table-body');
            if (!tbody) return;

            if (qList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center p-8 text-slate-500">No questions in bank.</td></tr>`;
                return;
            }

            tbody.innerHTML = qList.map(q => {
                let ansBadge = '<span class="text-slate-400 italic">None</span>';
                if (q.type === 'mcq') {
                    const opts = q.options || [];
                    const cVal = String(q.correctAnswer || '').trim();
                    let letter = '';
                    const cleanLetter = cVal.toUpperCase().replace(/^OPTION\s+/i, '').trim();
                    if (['A', 'B', 'C', 'D'].includes(cleanLetter)) {
                        letter = cleanLetter;
                    } else {
                        const idx = opts.findIndex(o => String(o).trim().toLowerCase() === cVal.toLowerCase());
                        if (idx >= 0) letter = ['A', 'B', 'C', 'D'][idx];
                    }
                    ansBadge = `<span class="px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 font-semibold border border-emerald-200 text-[11px]">${letter ? `[${letter}] ` : ''}${window.TCISUtils.escapeHTML(cVal || 'Not set')}</span>`;
                } else if (q.type === 'true_false') {
                    ansBadge = `<span class="px-2 py-0.5 rounded bg-emerald-50 text-emerald-700 font-bold border border-emerald-200 text-[11px]">${window.TCISUtils.escapeHTML(String(q.correctAnswer || 'True'))}</span>`;
                } else if (q.type === 'multi_select') {
                    const arr = Array.isArray(q.correctAnswer) ? q.correctAnswer : [q.correctAnswer].filter(Boolean);
                    ansBadge = `<span class="px-2 py-0.5 rounded bg-indigo-50 text-indigo-700 font-semibold border border-indigo-200 text-[10px]">${window.TCISUtils.escapeHTML(arr.join(', ') || 'None')}</span>`;
                } else if (q.type === 'short_answer' || q.type === 'fill_blank') {
                    ansBadge = `<span class="px-2 py-0.5 rounded bg-slate-100 text-slate-700 font-medium border border-slate-200 text-[11px]">${window.TCISUtils.escapeHTML(String(q.correctAnswer || q.expectedAnswer || ''))}</span>`;
                } else if (q.type === 'matching') {
                    ansBadge = `<span class="text-[10px] text-slate-500">${(q.matchingPairs || []).length} Pairs</span>`;
                } else if (q.type === 'essay') {
                    ansBadge = `<span class="text-[10px] text-amber-600 italic">Manual Grading</span>`;
                }

                return `
                <tr class="hover:bg-white/60 transition-colors">
                    <td class="p-4 pl-6 font-medium text-slate-900 max-w-md truncate">
                        ${window.TCISUtils.escapeHTML(q.questionText)}
                        ${q.imageUrl ? '<i class="fa-solid fa-image text-indigo-400 ml-1"></i>' : ''}
                    </td>
                    <td class="p-4">
                        <span class="px-2.5 py-1 rounded bg-slate-100 text-slate-600 font-semibold text-[10px]">${q.subject}</span>
                    </td>
                    <td class="p-4">
                        <span class="px-2.5 py-1 rounded-full bg-indigo-500/20 text-indigo-400 font-bold text-[10px] uppercase">${q.type}</span>
                    </td>
                    <td class="p-4 max-w-xs truncate">
                        ${ansBadge}
                    </td>
                    <td class="p-4 font-bold text-amber-400">${q.marks}</td>
                    <td class="p-4 pr-6 text-right">
                        <button onclick="editQuestion('${q.id}')" class="text-indigo-400 hover:text-indigo-300 mr-3" title="Edit"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteQuestion('${q.id}')" class="text-rose-400 hover:text-rose-300" title="Delete"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `;
            }).join('');
        }

        function filterQuestionsTable() {
            const query = document.getElementById('q-search').value.toLowerCase();
            const sub = document.getElementById('q-filter-subject').value;
            const type = document.getElementById('q-filter-type').value;

            const all = window.TCISQuestions.getAllQuestions();
            const filtered = all.filter(q => {
                const matchQ = q.questionText.toLowerCase().includes(query) || (q.topic || '').toLowerCase().includes(query);
                const matchSub = !sub || q.subject === sub;
                const matchType = !type || q.type === type;
                return matchQ && matchSub && matchType;
            });
            renderQBankTable(filtered);
        }

        function renderQuestionTypeFields() {
            const type = document.getElementById('qm-type').value;
            const container = document.getElementById('qm-dynamic-type-container');

            if (type === 'mcq') {
                container.innerHTML = `
                    <label class="block text-xs font-semibold text-slate-600">Answer Options (2 to 4 options):</label>
                    <div class="space-y-2">
                        <input type="text" id="opt-a" placeholder="Option A" class="w-full p-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-900">
                        <input type="text" id="opt-b" placeholder="Option B" class="w-full p-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-900">
                        <input type="text" id="opt-c" placeholder="Option C" class="w-full p-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-900">
                        <input type="text" id="opt-d" placeholder="Option D" class="w-full p-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-900">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mt-2">Correct Answer:</label>
                        <select id="qm-correct" class="w-full p-2 bg-white border border-slate-200 rounded-lg text-xs text-black">
                            <option value="A" class="text-black bg-white">Option A</option>
                            <option value="B" class="text-black bg-white">Option B</option>
                            <option value="C" class="text-black bg-white">Option C</option>
                            <option value="D" class="text-black bg-white">Option D</option>
                        </select>
                    </div>
                `;
            } else if (type === 'multi_select') {
                container.innerHTML = `
                    <label class="block text-xs font-semibold text-slate-600">Answer Options (2 to 4 options):</label>
                    <div class="space-y-2">
                        <input type="text" id="opt-a" placeholder="Option A" class="w-full p-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-900">
                        <input type="text" id="opt-b" placeholder="Option B" class="w-full p-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-900">
                        <input type="text" id="opt-c" placeholder="Option C" class="w-full p-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-900">
                        <input type="text" id="opt-d" placeholder="Option D" class="w-full p-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-900">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mt-2">Correct Answers (Hold Ctrl/Cmd to select multiple):</label>
                        <select id="qm-correct" multiple class="w-full p-2 bg-white border border-slate-200 rounded-lg text-xs text-black h-24">
                            <option value="A" class="text-black bg-white">Option A</option>
                            <option value="B" class="text-black bg-white">Option B</option>
                            <option value="C" class="text-black bg-white">Option C</option>
                            <option value="D" class="text-black bg-white">Option D</option>
                        </select>
                    </div>
                `;
            } else if (type === 'true_false') {
                container.innerHTML = `
                    <label class="block text-xs font-semibold text-slate-600">Correct Answer:</label>
                    <select id="qm-correct" class="w-full p-2 bg-white border border-slate-200 rounded-lg text-xs text-black">
                        <option value="True" class="text-black bg-white">True</option>
                        <option value="False" class="text-black bg-white">False</option>
                    </select>
                `;
            } else if (type === 'short_answer' || type === 'fill_blank') {
                container.innerHTML = `
                    <label class="block text-xs font-semibold text-slate-600">Expected Answer:</label>
                    <input type="text" id="qm-correct" placeholder="e.g. Accra" class="w-full p-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-900">
                `;
            } else if (type === 'essay') {
                container.innerHTML = `
                    <p class="text-xs text-slate-500">Essay questions will require manual evaluation by administrators.</p>
                `;
            } else if (type === 'matching') {
                container.innerHTML = `
                    <label class="block text-xs font-semibold text-slate-600">Matching Pairs:</label>
                    <div class="space-y-2">
                        <div class="flex gap-2">
                            <input type="text" id="m-left-1" placeholder="Left item 1 (e.g. Ghana)" class="w-1/2 p-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-900">
                            <input type="text" id="m-right-1" placeholder="Right match 1 (e.g. Accra)" class="w-1/2 p-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-900">
                        </div>
                        <div class="flex gap-2">
                            <input type="text" id="m-left-2" placeholder="Left item 2 (e.g. Nigeria)" class="w-1/2 p-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-900">
                            <input type="text" id="m-right-2" placeholder="Right match 2 (e.g. Abuja)" class="w-1/2 p-2 bg-white border border-slate-200 rounded-lg text-xs text-slate-900">
                        </div>
                    </div>
                `;
            }
        }

        function openQuestionModal() {
            document.getElementById('edit-q-id').value = "";
            document.getElementById('question-form').reset();
            resetImageUploadUI();
            renderQuestionTypeFields();
            document.getElementById('q-modal').classList.remove('hidden');
        }

        function closeQuestionModal() { document.getElementById('q-modal').classList.add('hidden'); }

        document.getElementById('question-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const editId = document.getElementById('edit-q-id').value;
            const type = document.getElementById('qm-type').value;

            const qData = {
                id: editId || undefined,
                subject: document.getElementById('qm-subject').value,
                type: type,
                marks: document.getElementById('qm-marks').value,
                questionText: document.getElementById('qm-text').value,
                imageUrl: document.getElementById('qm-image').value,
                explanation: document.getElementById('qm-explanation').value
            };

            if (type === 'mcq' || type === 'multi_select') {
                qData.options = [
                    document.getElementById('opt-a')?.value,
                    document.getElementById('opt-b')?.value,
                    document.getElementById('opt-c')?.value,
                    document.getElementById('opt-d')?.value
                ].filter(Boolean);
                
                if (type === 'mcq') {
                    const sel = document.getElementById('qm-correct')?.value;
                    if (sel === 'A') qData.correctAnswer = document.getElementById('opt-a')?.value;
                    if (sel === 'B') qData.correctAnswer = document.getElementById('opt-b')?.value;
                    if (sel === 'C') qData.correctAnswer = document.getElementById('opt-c')?.value;
                    if (sel === 'D') qData.correctAnswer = document.getElementById('opt-d')?.value;
                } else {
                    const selOpts = Array.from(document.getElementById('qm-correct').selectedOptions).map(o => o.value);
                    qData.correctAnswer = selOpts.map(val => {
                        if (val === 'A') return document.getElementById('opt-a')?.value;
                        if (val === 'B') return document.getElementById('opt-b')?.value;
                        if (val === 'C') return document.getElementById('opt-c')?.value;
                        if (val === 'D') return document.getElementById('opt-d')?.value;
                    }).filter(Boolean);
                }
            } else if (type === 'true_false' || type === 'short_answer' || type === 'fill_blank') {
                qData.correctAnswer = document.getElementById('qm-correct')?.value;
            } else if (type === 'matching') {
                qData.matchingPairs = [
                    { left: document.getElementById('m-left-1')?.value, right: document.getElementById('m-right-1')?.value },
                    { left: document.getElementById('m-left-2')?.value, right: document.getElementById('m-right-2')?.value }
                ].filter(p => p.left && p.right);
            }

            if (editId) window.TCISQuestions.updateQuestion(editId, qData);
            else window.TCISQuestions.addQuestion(qData);

            window.TCISUtils.showToast('Question saved to bank!', 'success');
            closeQuestionModal();
            renderQBankTable();
        });

        function editQuestion(id) {
            const q = window.TCISDB.getItem('questionBank', 'id', id);
            if (!q) return;

            document.getElementById('edit-q-id').value = q.id;
            document.getElementById('qm-subject').value = q.subject;
            document.getElementById('qm-type').value = q.type;
            document.getElementById('qm-marks').value = q.marks;
            document.getElementById('qm-text').value = q.questionText;
            document.getElementById('qm-image').value = q.imageUrl || '';
            document.getElementById('qm-explanation').value = q.explanation || '';
            // Show image preview if exists
            resetImageUploadUI();
            if (q.imageUrl) previewUrlImage(q.imageUrl);

            renderQuestionTypeFields();

            if (q.type === 'mcq' || q.type === 'multi_select') {
                if (q.options && q.options[0]) document.getElementById('opt-a').value = q.options[0];
                if (q.options && q.options[1]) document.getElementById('opt-b').value = q.options[1];
                if (q.options && q.options[2]) document.getElementById('opt-c').value = q.options[2];
                if (q.options && q.options[3]) document.getElementById('opt-d').value = q.options[3];

                if (q.type === 'mcq') {
                    const opts = q.options || [];
                    const cVal = String(q.correctAnswer || '').trim().toLowerCase();
                    const cleanLetter = cVal.replace(/^option\s+/i, '').trim();

                    if (cleanLetter === 'a' || (opts[0] && cVal === String(opts[0]).trim().toLowerCase())) {
                        document.getElementById('qm-correct').value = 'A';
                    } else if (cleanLetter === 'b' || (opts[1] && cVal === String(opts[1]).trim().toLowerCase())) {
                        document.getElementById('qm-correct').value = 'B';
                    } else if (cleanLetter === 'c' || (opts[2] && cVal === String(opts[2]).trim().toLowerCase())) {
                        document.getElementById('qm-correct').value = 'C';
                    } else if (cleanLetter === 'd' || (opts[3] && cVal === String(opts[3]).trim().toLowerCase())) {
                        document.getElementById('qm-correct').value = 'D';
                    } else {
                        document.getElementById('qm-correct').value = 'A';
                    }
                } else {
                    const sel = document.getElementById('qm-correct');
                    const opts = q.options || [];
                    const rawArr = Array.isArray(q.correctAnswer) ? q.correctAnswer : (q.correctAnswer ? [q.correctAnswer] : []);
                    const cleanCorrectList = rawArr.map(x => String(x).trim().toLowerCase());

                    Array.from(sel.options).forEach(opt => {
                        let idx = opt.value === 'A' ? 0 : opt.value === 'B' ? 1 : opt.value === 'C' ? 2 : 3;
                        const optVal = opts[idx] ? String(opts[idx]).trim().toLowerCase() : null;
                        const optLet = opt.value.toLowerCase();
                        if (cleanCorrectList.includes(optLet) || (optVal && cleanCorrectList.includes(optVal))) {
                            opt.selected = true;
                        }
                    });
                }
            } else if (document.getElementById('qm-correct')) {
                document.getElementById('qm-correct').value = q.correctAnswer || '';
            }

            document.getElementById('q-modal').classList.remove('hidden');
        }

        function deleteQuestion(id) {
            window.TCISQuestions.deleteQuestion(id);
            window.TCISUtils.showToast('Question deleted.', 'info');
            renderQBankTable();
        }
    </script>
</body>
</html>
