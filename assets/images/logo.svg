    <path d="M 50 25 L 50 102 C 50 102 61 93 70 76 C 78 55 70 25 70 25 Z" fill="#ffffff" opacity="0.15"/>
    
    <!-- Academic Torch & Star -->
    <path d="M 50 32 L 56 46 L 71 46 L 59 55 L 63 70 L 50 60 L 37 70 L 41 55 L 29 46 L 44 46 Z" fill="url(#goldGrad)"/>
    <circle cx="50" cy="52" r="5" fill="#ffffff"/>
  </g>
  
  <!-- Text Branding -->
  <text x="100" y="58" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="38" fill="#0F172A" letter-spacing="1">TCIS</text>
  <text x="100" y="82" font-family="'Inter', sans-serif" font-weight="600" font-size="14" fill="#4F46E5" letter-spacing="2">ENTRANCE EXAMINATION PORTAL</text>
  <text x="100" y="100" font-family="'Inter', sans-serif" font-weight="400" font-size="10" fill="#64748B" letter-spacing="0.5">EXCELLENCE • INTEGRITY • KNOWLEDGE</text>
</svg>
